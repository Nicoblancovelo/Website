type: file
    path: gallery.json
    format: json
    operations:
      delete: false
    fields:
      - name: photos
        label: Photographs
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - name: image
            label: Photograph
            type: image
            required: true
          - name: caption
            label: Caption
            type: text
