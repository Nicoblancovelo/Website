<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Nico Blanco-Velo</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #1d1d1d;
      font-family: "Times New Roman", Times, serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100% - 36px, 1040px);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(32px, 7vh, 68px) 0 32px;
    h1 {
    margin: 0 0 32px;
    text-align: center;
    font-family: "Times New Roman", Times, serif;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: normal;
    text-transform: none;
    }
    figure { margin: 0; }
    .image-frame {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 160px;
    }
    img {
      display: block;
      max-width: 100%;
      max-height: 68vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    figcaption {
      max-width: 750px;
      margin: 22px auto 0;
      text-align: center;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-line;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 750px;
      margin: 28px auto 0;
    }
    button {
      border: 0;
      background: none;
      color: inherit;
      padding: 8px 0;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { text-decoration: underline; text-underline-offset: 4px; }
    button:focus-visible { outline: 2px solid; outline-offset: 4px; }
    button:disabled { opacity: 0.25; cursor: default; }
    .status { text-align: center; color: #666; padding: 48px 0; font-size: 14px; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      img { max-height: 62vh; }
      figcaption { margin-top: 16px; }
      .controls { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <!-- Change "Your Name" here and in the <title> above. -->
   <h1><a href="/">Nico Blanco-Velo</a></h1>

    <p id="status" class="status" role="status">Loading photographs…</p>

    <section id="gallery" hidden aria-label="Photo gallery">
      <figure>
        <div class="image-frame">
          <img id="photo" alt="" decoding="async">
        </div>
        <figcaption id="caption"></figcaption>
      </figure>
      <nav id="controls" class="controls" aria-label="Gallery navigation">
        <button id="previous" type="button" aria-label="Previous photograph">← Previous</button>
        <button id="next" type="button" aria-label="Next photograph">Next →</button>
      </nav>
    </section>
  </main>
  <script>
    (() => {
      const status = document.getElementById('status');
      const gallery = document.getElementById('gallery');
      const photo = document.getElementById('photo');
      const caption = document.getElementById('caption');
      const controls = document.getElementById('controls');
      const previous = document.getElementById('previous');
      const next = document.getElementById('next');
      let photographs = [];
      let current = 0;

      function showPhotograph(index) {
        if (index < 0 || index >= photographs.length) return;
        current = index;
        const item = photographs[current];
        photo.src = item.image;
        photo.alt = item.caption || `Photograph ${current + 1}`;
        caption.textContent = item.caption || '';
        previous.disabled = current === 0;
        next.disabled = current === photographs.length - 1;
      }

      previous.addEventListener('click', () => showPhotograph(current - 1));
      next.addEventListener('click', () => showPhotograph(current + 1));
      document.addEventListener('keydown', (event) => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest('input, textarea, select')) return;
        if (event.key === 'ArrowLeft') showPhotograph(current - 1);
        if (event.key === 'ArrowRight') showPhotograph(current + 1);
      });

      fetch('/gallery.json', { cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((data) => {
          photographs = (Array.isArray(data.photos) ? data.photos : [])
            .filter((item) => item && typeof item.image === 'string' && item.image.trim());
          if (!photographs.length) {
            status.textContent = 'No photographs have been added yet.';
            return;
          }
          status.hidden = true;
          gallery.hidden = false;
          controls.hidden = photographs.length === 1;
          showPhotograph(0);
        })
        .catch((error) => {
          status.textContent = 'The gallery could not be loaded.';
          console.error('Gallery loading error:', error);
        });
    })();
  </script>
</body>
</html>
